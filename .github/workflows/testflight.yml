# Receta de GitHub: compila la app de iOS en un Mac de la nube y la envia a TestFlight.
# Se lanza a mano: pestana "Actions" > "Compilar y enviar a TestFlight" > "Run workflow".
# Las claves NUNCA van en este archivo: se leen de los "Secrets" del repositorio.

name: Compilar y enviar a TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BUNDLE_ID: com.satfleetlive.app
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Comprobar que estan todos los secretos
        env:
          P12: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12PW: ${{ secrets.DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          check() { if [ -z "$2" ]; then echo "::error::Falta el secreto $1"; missing=1; fi; }
          check APPLE_TEAM_ID "$APPLE_TEAM_ID"
          check ASC_KEY_ID "$ASC_KEY_ID"
          check ASC_ISSUER_ID "$ASC_ISSUER_ID"
          check ASC_KEY_P8 "$P8"
          check DIST_CERT_P12_BASE64 "$P12"
          check DIST_CERT_PASSWORD "$P12PW"
          check PROVISIONING_PROFILE_BASE64 "$PROFILE"
          exit $missing

      - name: Comprobar la version de Xcode
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Este Mac de GitHub tiene Xcode $MAJOR y Apple exige Xcode 26 o posterior."
            exit 1
          fi

      - name: Fabricar el proyecto de Xcode
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Instalar el certificado de firma
        env:
          P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$P12_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Certificado intermedio de Apple (si ya estaba, no pasa nada)
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer" \
            && security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN" || true
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::El certificado no es de tipo Apple Distribution."
            exit 1
          fi
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Instalar el perfil de aprovisionamiento
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          printf '%s' "$PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          APPID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          echo "Perfil: $NAME ($UUID) para $APPID"
          case "$APPID" in
            *".$BUNDLE_ID") ;;
            *) echo "::error::El perfil es para $APPID y no para $BUNDLE_ID."; exit 1 ;;
          esac
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/app.mobileprovision" "$dir/$UUID.mobileprovision"
          done
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Preparar la clave de App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Compilar la app
        run: |
          xcodebuild archive \
            -project SatFleetLive.xcodeproj \
            -scheme SatFleetLive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SatFleetLive.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Firmar y subir a TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SatFleetLive.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Resumen
        if: success()
        run: |
          {
            echo "## Compilacion ${{ github.run_number }} enviada a TestFlight"
            echo ""
            echo "Apple tarda entre 5 y 30 minutos en procesarla. Despues aparece en la app TestFlight del iPad."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Errores encontrados (copialos y pasaselos a Claude)
        if: failure()
        run: |
          {
            echo "## La compilacion ha fallado"
            echo ""
            echo "Errores encontrados:"
            echo '```'
            if [ -f "$RUNNER_TEMP/build.log" ]; then
              grep -E "error:|Error |ERROR|failed|FAILED" "$RUNNER_TEMP/build.log" | sort -u | head -60
            else
              echo "Ha fallado antes de compilar. Mira el paso marcado en rojo."
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Limpiar claves
        if: always()
        run: |
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist"
