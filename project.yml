# Descripcion del proyecto de la app de iOS de SatFleet Live.
# El Mac de GitHub lee este archivo y fabrica con el el proyecto de Xcode
# (con la herramienta XcodeGen), asi no hace falta un Mac propio.

name: SatFleetLive

options:
  bundleIdPrefix: com.satfleetlive
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.0"         # version visible en la tienda
    CURRENT_PROJECT_VERSION: "1"     # numero de compilacion (GitHub lo sube solo en cada envio)
    SWIFT_VERSION: "5.0"

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: "5.0.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

targets:
  SatFleetLive:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SatFleetLive
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: RevenueCat
        product: RevenueCat
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: SatFleetLive.entitlements
      properties:
        com.apple.developer.applesignin:      # "Iniciar sesion con Apple"
          - Default
        aps-environment: production                # notificaciones (Push)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satfleetlive.app
        PRODUCT_NAME: SatFleetLive
        TARGETED_DEVICE_FAMILY: "1,2"              # iPhone y iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:                                   # firma solo de la app (no de las librerias)
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER: ${PROFILE_UUID}
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SatFleet Live
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false       # evita la pregunta de cifrado en TestFlight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground            # fondo oscuro al arrancar (sin flash blanco)
        UIStatusBarStyle: UIStatusBarStyleLightContent
        CFBundleURLTypes:                          # necesario para "Continuar con Google"
          - CFBundleURLName: google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.369952976257-vbobropsjoiga5dvev6qs59v4de6a35h
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "SatFleet Live uses the camera for AR Sky View, to show satellites over the real sky."
        NSLocationWhenInUseUsageDescription: "SatFleet Live uses your location to show which satellites pass over you and to align AR Sky View."
    scheme: {}